[project]
name = "relay"
version = "0.1.0"
description = "walkie-talkie relay service"
authors = [
    {name = "Dhruv2617",email = "dhruvanand2617@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "redis (>=8.1.0,<9.0.0)"
]

[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
fakeredis = "^2.38.0"
httpx = "^0.28.1"
pytest = "^9.1.1"

